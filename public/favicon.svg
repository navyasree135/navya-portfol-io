<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Deep navy background gradient to match the site's dark contrast -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <!-- Neon Sky Blue / Purple text gradient to match the site's neon highlights -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Subtle cinematic glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Smooth rounded Apple-style squircle background -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />
  
  <!-- Elegant cinematic serif initial 'D N' -->
  <text 
    x="50" 
    y="66" 
    font-family="'Cormorant Garamond', Georgia, serif" 
    font-weight="700" 
    font-style="normal" 
    font-size="44" 
    fill="url(#textGrad)" 
    text-anchor="middle" 
    filter="url(#glow)"
  >
    D N
  </text>
</svg>
